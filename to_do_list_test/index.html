<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>極簡美學待辦事項 - Minimalist Todo</title>
  <!-- 引入 Google Fonts Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background-glow-1"></div>
  <div class="background-glow-2"></div>
  
  <div class="app-container">
    <header class="app-header">
      <h1 id="app-title">Todo List</h1>
      <p id="app-subtitle">專注當下，逐步實現你的精彩計畫</p>
    </header>

    <main class="app-card">
      <!-- 輸入待辦事項區域 -->
      <form id="todo-form" class="todo-input-group" onsubmit="event.preventDefault();">
        <input 
          type="text" 
          id="todo-input" 
          placeholder="新增待辦事項..." 
          autocomplete="off" 
          required
        >
        <button type="submit" id="todo-add-btn" aria-label="新增待辦事項">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="btn-icon">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </form>

      <!-- 篩選與狀態列 -->
      <div class="todo-controls">
        <div class="todo-filter-tabs">
          <button id="filter-all" class="filter-tab active" data-filter="all">全部</button>
          <button id="filter-active" class="filter-tab" data-filter="active">未完成</button>
          <button id="filter-completed" class="filter-tab" data-filter="completed">已完成</button>
        </div>
        <div id="todo-stats" class="todo-stats">
          剩餘 <span id="active-count">0</span> 項未完成
        </div>
      </div>

      <!-- 待辦事項清單列表 -->
      <ul id="todo-list" class="todo-list-container">
        <!-- 待辦事項項目將由 JavaScript 動態生成 -->
      </ul>

      <!-- 空白狀態提示 -->
      <div id="empty-state" class="empty-state">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="empty-icon">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        <p>目前沒有任何待辦事項</p>
      </div>
    </main>

    <footer class="app-footer">
      <p>極簡美學待辦事項 © 2026</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
